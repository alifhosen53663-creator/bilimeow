
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliMeow</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      background: #181818;
      color: #ff3158;
      font-size: 28px;
      font-weight: bold;
    }
    main { padding: 20px; }
    .card {
      background: #252525;
      padding: 20px;
      margin: 12px 0;
      border-radius: 12px;
    }
    button {
      background: #ff3158;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>🐱 BiliMeow</header>
  <main>
    <h2>Welcome to BiliMeow</h2>
    <p>Movies • Series • Live TV</p>
    <div class="card">
      <h3>🎬 Movies</h3>
      <p>Discover your favourite movies.</p>
      <button onclick="alert('Movies coming soon!')">Explore</button>
    </div>
    <div class="card">
      <h3>📺 Series</h3>
      <p>Your series collection will appear here.</p>
      <button onclick="alert('Series coming soon!')">Explore</button>
    </div>
    <div class="card">
      <h3>📡 Live TV</h3>
      <p>Add channels you have permission to stream.</p>
      <button onclick="alert('Live TV coming soon!')">Explore</button>
    </div>
  </main>
</body>
</html>
